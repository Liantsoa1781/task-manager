<h2>Liste des tâches</h2>

<table border="1">
    <thead>
        <tr>
            <td>Nom de la tâche</td>
            <td>État de la tâche</td>
            <td></td>
        </tr>
    </thead>
    <tbody>
        @for (task of taskService.getTasks(); track task; let i = $index) { 
            <tr>
                <td> <a [routerLink]="['/task', i]"> {{task.desc}} </a></td>
                <td><button (click)="taskService.tooggleTask(i)">{{task.completed ? 'Terminé' : 'En cours'}}</button></td>
                <td><button (click)="taskService.deleteTask(i)">Supprimer</button></td>
            </tr>
        }
    </tbody>
    
</table>
    
<h2>Ajouter une nouvelle tâche</h2>
<input [ngModel]="taskService.newTask()" (ngModelChange)="taskService.newTask.set($event)">
<button (click)="taskService.addTask()">Ajouter</button>
