<h2>Liste des tâches</h2>

<table border="1">
    <thead>
        <tr>
            <td>Nom de la tâche</td>
            <td>État de la tâche</td>
            <td></td>
        </tr>
    </thead>
    <tbody>
        @for (task of tasks; track task; let i = $index) { 
            <tr>
                <td>{{task.desc}}</td>
                <td><button (click)="toogleTask(i)">{{task.completed ? 'Terminé' : 'En cours'}}</button></td>
                <td><button (click)="deleteTask(i)">Supprimer</button></td>
            </tr>
        }
    </tbody>
    
</table>
    


<h2>Ajouter une nouvelle tâche</h2>
<input [ngModel]="newTask()" (ngModelChange)="newTask.set($event)">
<button (click)="addTask()">Ajouter</button>
